databaseChangeLog:
  - changeSet:
      id: 2
      author: Alex_Hlebko
      changes:
        - createTable:
            tableName: payment_cards
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                      nullable: false
                      primaryKey: true

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    referencedTableName: users
                    referencedColumnNames: id
                    foreignKeyName: fk_payment_cards_users

              - column:
                  name: number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: holder
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: expiration_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP

        - createIndex:
            indexName: indexCardsNumber
            tableName: payment_cards
            unique: true
            columns:
              - column:
                  name: number

        - createIndex:
            indexName: indexCardsHolder
            tableName: payment_cards
            columns:
              - column:
                  name: user_id

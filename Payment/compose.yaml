services:
  postgres_db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  mongo_db:
    image: mongo:latest
    container_name: mongo_db
    ports:
      - "27017:27017"

  redis_cache:
    image: redis:latest
    container_name: redis_cache
    ports:
      - "6379:6379"

  payment-service:
    build: .
    container_name: payment_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - postgres_db
      - mongo_db
      - redis_cache
services:
  auth_db:
    image: postgres:15
    container_name: auth_db_container
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    networks:
      - auth-network

  auth-app:
    build: .
    container_name: auth_app_container
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:postgresql://auth_db:5432/identity_db
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - auth_db
    networks:
      - auth-network

networks:
  auth-network:
    driver: bridge
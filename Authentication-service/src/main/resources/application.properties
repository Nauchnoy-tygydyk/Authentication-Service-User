spring.application.name=authentication-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5433/identity_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}

library.jwt.secret=${JWT_SECRET:myVerySecretKeyForSigningJWTsTokens2026!}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

app.jwt.refresh-expiration=604800000


library.jwt.expiration=900000

logging.level.org.springframework.security=DEBUG
logging.level.org.example.authenticationservice=INFO

app.services.user-service.url=${USER_SERVICE_URL:http://localhost:8080}


server:
  port: 8080

spring:
  application:
    name: API-Gateway
  cloud:
    gateway:
      routes:
      - id: auth-service
        uri: http://localhost:8082
        predicates:
          - Path=/auth/**

      - id: order-service
        uri: http://localhost:8081
        predicates:
          - Path=/api/orders/**

      - id: user-service
        uri: http://localhost:8083
        predicates:
          - Path=/api/users/**, /api/cards/**

services:
  auth-service:
    url: http://localhost:8082
  user-service:
    url: http://localhost:8083


name: Payment Service CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'Payment-service/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'Payment-service/**'

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: mvn clean package -f Payment-service/pom.xml

      - name: Code Analysis
        run: mvn compile -f Payment-service/pom.xml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./Payment-service
          file: ./Payment-service/Dockerfile
          push: true
          tags: tygydyc/payment-service:latest
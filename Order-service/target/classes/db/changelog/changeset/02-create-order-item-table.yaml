databaseChangeLog:
  - changeSet:
      id: 2
      author: Alex_Hlebko
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    referencedTableName: orders
                    referencedColumnNames: id
                    foreignKeyName: fk_order_items_orders
              - column:
                  name: item_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    referencedTableName: items
                    referencedColumnNames: id
                    foreignKeyName: fk_order_items_items

              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
                    

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP


        - createIndex:
            indexName: idx_order_items_order_id
            tableName: order_items
            columns:
              - column:
                  name: order_id

        - createIndex:
            indexName: idx_order_items_item_id
            tableName: order_items
            columns:
              - column:
                  name: item_id
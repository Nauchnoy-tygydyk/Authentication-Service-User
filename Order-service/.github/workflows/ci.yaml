name: Order Service CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 1 & 2. Build & Testing
      - name: Build and Test with Maven
        run: mvn clean package

      # 3. Code Analysis (Optional) - проверим корректность стиля кода
      - name: Run Static Code Analysis
        run: mvn checkstyle:check || echo "Checkstyle found issues, but continuing..."

      # Логинимся в Docker Hub, чтобы иметь право отправить туда артефакт
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Artefact Creation (Build & Push)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Замени 'ваш-логин' на свой ник на Docker Hub
          tags: tygydyc/order-service:latest
services:
  order-db:
    image: postgres:15-alpine
    container_name: order_db_container
    environment:
      POSTGRES_DB: order_database
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"

  order-service:
    build: .
    container_name: order_app_container
    ports:
      - "8081:8081"
    environment:
      - DB_URL=jdbc:postgresql://order-db:5432/order_database
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
    depends_on:
      - order-db

databaseChangeLog:
  - changeSet:
      id: 3
      author: Alex_Hlebko
      changes:
        - createTable:
            tableName: items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false


              - column:
                  name: price
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false



              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP

        - createIndex:
            indexName: idx_item_name
            tableName: items
            columns:
              - column:
                  name: name
